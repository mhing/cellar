<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cellar Ledger</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M11 3h10l-1 9a5 5 0 0 1-3 4v9h4v3H11v-3h4v-9a5 5 0 0 1-3-4z' fill='%236E1423'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-view="all">
  <header class="site-header">
    <div>
      <span class="eyebrow">Private cellar reference</span>
      <h1>Cellar Ledger</h1>
    </div>
    <div class="header-actions">
      <span class="save-status" id="save-status" role="status" aria-live="polite"></span>
      <button type="button" class="btn" id="bought-toggle">Add bottles</button>
      <button type="button" class="btn" id="edit-toggle" aria-pressed="false">Edit</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <nav class="view-tabs" role="tablist" aria-label="Cellar view">
    <button type="button" class="view-tab" role="tab" data-view="all">Full Cellar</button>
    <button type="button" class="view-tab" role="tab" data-view="champagne">Champagne</button>
    <button type="button" class="view-tab" role="tab" data-view="red">Reds</button>
    <button type="button" class="view-tab" role="tab" data-view="shelves">Shelf map</button>
    <button type="button" class="view-tab" role="tab" data-view="fillers">Fillers</button>
    <button type="button" class="view-tab" role="tab" data-view="ratings">Ratings</button>
    <button type="button" class="view-tab" role="tab" data-view="recycle">Recycle bin</button>
  </nav>

  <main id="app">
    <p class="loading">Loading the ledger…</p>
  </main>

  <dialog id="editor" aria-labelledby="editor-title">
    <form method="dialog" id="editor-form">
      <h2 id="editor-title">Edit bottle</h2>
      <div id="editor-fields" class="form-grid"></div>
      <div class="dialog-actions">
        <span class="step-note" id="editor-step" hidden></span>
        <button type="button" class="btn ghost" id="editor-cancel">Cancel</button>
        <button type="button" class="btn ghost" id="editor-back" hidden>Back</button>
        <button type="submit" class="btn primary" id="editor-save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="card" class="bottle-card" aria-labelledby="card-title">
    <div id="card-body"></div>
  </dialog>

  <dialog id="drank" aria-labelledby="drank-title">
    <form method="dialog" id="drank-form">
      <h2 id="drank-title">Drank</h2>
      <p class="section-note" id="drank-hint"></p>
      <div class="dials">
        <div class="dial-field"><span class="dial-label">Matt</span><div class="dial" id="dial-matt" tabindex="0" aria-label="Matt's score"></div></div>
        <div class="dial-field"><span class="dial-label">Rachael</span><div class="dial" id="dial-rachael" tabindex="0" aria-label="Rachael's score"></div></div>
        <div class="dial-field avg"><span class="dial-label">Average</span><div class="avg-value" id="drank-avg">—</div></div>
      </div>
      <div class="form-grid">
        <label>Drunk on<input type="date" id="drank-date" name="drankAt"></label>
        <label class="full">Notes<textarea id="drank-notes" name="notes" placeholder="With what, with whom, how was it"></textarea></label>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="drank-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="drank-save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="bought" aria-labelledby="bought-title">
    <form method="dialog" id="bought-form">
      <h2 id="bought-title">Add bottles</h2>
      <p class="section-note">Build the list, then fill in the details for each bottle.</p>
      <div class="mode-row" role="radiogroup" aria-label="What are you adding?">
        <label class="mode"><input type="radio" name="mode" value="filler" checked> From the fillers lists</label>
        <label class="mode"><input type="radio" name="mode" value="existing"> More of a bottle already in the cellar</label>
        <label class="mode"><input type="radio" name="mode" value="new"> A new bottle</label>
      </div>
      <div class="form-grid picker">
        <label class="full" data-mode="filler">Bottle<select id="bought-filler"></select></label>
        <label class="full" data-mode="existing">Bottle<select id="bought-existing"></select></label>
        <div class="full mode-row" data-mode="new">
          <label class="mode"><input type="radio" name="newWine" value="champagne" checked> Champagne</label>
          <label class="mode"><input type="radio" name="newWine" value="reds"> Red</label>
        </div>
        <label data-mode="new" data-new-field="house">House *<input type="text" id="bought-new-house" autocomplete="off"></label>
        <label data-mode="new" data-new-field="cuvee">Cuvée *<input type="text" id="bought-new-cuvee" autocomplete="off"></label>
        <label>Quantity<input type="number" id="bought-qty" min="1" step="1" value="1"></label>
        <div class="picker-actions"><button type="button" class="btn" id="bought-add">Add to list</button></div>
      </div>
      <div class="cart" id="cart">
        <div class="cart-head"><h3>To add</h3><span class="filter-count" id="cart-count"></span></div>
        <ul class="cart-list" id="cart-list"></ul>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="bought-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="bought-next" disabled>Next: details</button>
      </div>
    </form>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
