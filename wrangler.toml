# Cloudflare Worker config. The name must match the Worker connected to this
# repo in the dashboard (Workers Builds deploys on every push to main).
name = "cellar"
account_id = "eab1e74a57fef868872e3daa196f6c19"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Static site. Requests to /api/* always run the Worker; everything else is
# served from public/ (404 if the file doesn't exist).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# KV namespace that stores the ledger. Deploying to a different account?
# Create your own with `npx wrangler kv namespace create CELLAR_KV` and
# replace the id (and account_id above).
[[kv_namespaces]]
binding = "CELLAR_KV"
id = "e10bc28d1076464baf26501747047605"

# Cloudflare Access settings (README step 4). Neither value is a secret.
[vars]
ACCESS_TEAM_DOMAIN = "matthew-hinger.cloudflareaccess.com"
ACCESS_AUD = "01e411a04fc70fcbabe52d269c2b578ac10a56a30ea10d6c2d171502ac2bd791"

# Branch previews (Workers Builds deploys every non-main push to a preview
# URL). They get their own empty KV namespace so a preview can never touch
# the live ledger; Access settings are shared.
[previews.vars]
ACCESS_TEAM_DOMAIN = "matthew-hinger.cloudflareaccess.com"
ACCESS_AUD = "01e411a04fc70fcbabe52d269c2b578ac10a56a30ea10d6c2d171502ac2bd791"

[[previews.kv_namespaces]]
binding = "CELLAR_KV"
id = "f1c28fa62d52413c959b826a3eca1f83"
